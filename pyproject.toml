[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-grader"
version = "0.1.0"
description = "Local Math Grader application foundation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18,<5", "huggingface_hub>=0.30,<2", "Pillow>=10,<12", "opencv-python-headless>=4.8,<5"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]
ocr = ["onnxruntime>=1.18,<2"]
formula = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
vision = ["mlx-vlm>=0.3,<1"]

[tool.setuptools]
packages = ["benchmark", "local_service"]
include-package-data = true

[tool.setuptools.package-data]
benchmark = ["schemas/*.json", "reports/*.md"]
local_service = ["migrations/*.sql", "config/*.json", "capture_page.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
