[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-grader"
version = "0.1.0"
description = "Local Math Grader application foundation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools]
packages = ["benchmark", "local_service"]
include-package-data = true

[tool.setuptools.package-data]
benchmark = ["schemas/*.json", "reports/*.md"]
local_service = ["migrations/*.sql", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
