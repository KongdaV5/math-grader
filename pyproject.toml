[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-grader-benchmark"
version = "0.1.0"
description = "Local benchmark foundation for the Math Grader project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools]
packages = ["benchmark"]
include-package-data = true

[tool.setuptools.package-data]
benchmark = ["schemas/*.json", "reports/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
